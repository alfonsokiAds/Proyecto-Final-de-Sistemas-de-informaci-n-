<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierra Store</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #4EA447;
        }

        header {
            background-color: #C09817;
            padding: 20px 0;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .shoe {
            width: 250px;
            margin: 10px;
            border: 1px solid #ddd;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .shoe img {
            width: 100%;
            height: auto;
        }

        .shoe h3 {
            margin-top: 10px;
            font-size: 1.5em;
        }

        .shoe p {
            margin-bottom: 10px;
            color: #555;
        }

        .shoe button {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
        }

        .shoe button:hover {
            background-color: #0056b3;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tierra Store</h1>
    </header>

    <div class="container">
        <div class="shoe">
            <img src="https://images.pexels.com/photos/2385477/pexels-photo-2385477.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Zapato 1">
            <h3>Zapato Deportivo</h3>
            <p>Precio: $50.00</p>
            <button>Añadir al Carrito</button>
        </div>

        <div class="shoe">
            <img src="https://cdn.pixabay.com/photo/2013/07/12/18/20/shoes-153310_1280.png" alt="Zapato 2">
            <h3>Zapato Casual</h3>
            <p>Precio: $60.00</p>
            <button>Añadir al Carrito</button>
        </div>

        <div class="shoe">
            <img src="https://cdn.pixabay.com/photo/2018/11/30/01/03/winter-boots-3846863_1280.jpg" alt="Zapato 3">
            <h3>Botas de Invierno</h3>
            <p>Precio: $80.00</p>
            <button>Añadir al Carrito</button>
        </div>

        <div class="shoe">
            <img src="https://cdn.pixabay.com/photo/2019/01/31/08/51/shoes-3966245_1280.jpg" alt="Zapato 4">
            <h3>Zapato Formal</h3>
            <p>Precio: $100.00</p>
            <button>Añadir al Carrito</button>
        </div>

        <div class="shoe">
            <img src="https://cdn.pixabay.com/photo/2013/11/20/23/48/flip-flops-214318_960_720.jpg" alt="Zapato 5">
            <h3>Sandalias de Verano</h3>
            <p>Precio: $30.00</p>
            <button>Añadir al Carrito</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Tierra Store. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
